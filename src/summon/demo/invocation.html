<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Rift · Invocation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: nuit dramatique de gacha, chrome et énergie
   IDEA: la faille d'Anime Rift — un portail qu'on aspire pour invoquer
   PICTURE: portail WebGL vivant, comète et pluie de cristaux, cartes qui se retournent
   COLOUR and TYPE: nuit violette #0a0810, accent de bannière, Oswald capitales + Inter
   LAYOUT: écrans plein cadre centrés : bannières → portail → séquence → révélation → récap */
:root{color-scheme:dark;--acc:180,110,255;--ink:#ece8f4;--mute:#9a93ad;--gold:#f3c552}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0a0810 url(bg.jpg) center/cover;color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid rgb(var(--acc));outline-offset:3px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scr{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .45s}
.scr.on{opacity:1;pointer-events:auto}
.cap{font:700 clamp(26px,4vw,40px)/1.05 Oswald,'Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:0}
.mono{font:500 11px JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
/* ---- bannières ---- */
#list{padding:34px 20px 50px;gap:22px}
#list header{text-align:center}
#list header img{width:min(340px,70vw);display:block;margin:0 auto -6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;width:min(1100px,100%)}
.ban{position:relative;height:150px;border-radius:16px;overflow:hidden;text-align:left;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;
 background:radial-gradient(120% 140% at 85% 10%,rgba(var(--c),.55),transparent 55%),linear-gradient(160deg,#1b1524,#0e0b14);border:1px solid rgba(var(--c),.35);transition:transform .25s,border-color .25s,box-shadow .25s}
.ban:hover{transform:translateY(-3px);border-color:rgba(var(--c),.8);box-shadow:0 10px 40px -10px rgba(var(--c),.6)}
.ban img{position:absolute;right:-10px;top:-14px;height:190px;opacity:.9;filter:drop-shadow(0 0 14px rgba(var(--c),.6));transition:transform .4s}
.ban:hover img{transform:rotate(-4deg) scale(1.04)}
.ban b{font:700 22px Oswald,'Arial Narrow',Impact,sans-serif;text-transform:uppercase;position:relative}
.ban small{position:relative;color:var(--mute);font-size:12px}
/* ---- portail ---- */
#hub{padding:18px 16px 30px;gap:12px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:min(1040px,100%)}
.bk{justify-self:start;font-weight:700;color:#d8d4cc;padding:8px 4px}
.fav{justify-self:end;width:36px;height:36px;border-radius:50%;border:1px solid #3a3446}
.fav.on{color:var(--gold);border-color:var(--gold)}
#hub .tag b{color:rgb(var(--acc))}
.stage{display:grid;place-items:center;width:100%;margin:-4px 0 -8px}
.portal{--sz:min(460px,50vh,88vw);--pull:0;position:relative;width:calc(var(--sz)*1.15);height:var(--sz);touch-action:none;-webkit-tap-highlight-color:transparent;
 transform:scale(calc(1 + var(--pull)*.04));transition:transform .2s;animation:float 4.2s ease-in-out infinite}
.portal.pressed{transform:scale(.97)}
.portal .glow{position:absolute;inset:-4% 22%;border-radius:50%;pointer-events:none;filter:blur(22px);
 background:radial-gradient(closest-side,rgba(var(--acc),calc(.55 + var(--pull)*.4)),rgba(var(--acc),.18) 60%,transparent 78%);animation:breathe 3.4s ease-in-out infinite}
.portal canvas{position:absolute;inset:0;width:100%;height:100%}
@keyframes float{50%{translate:0 -8px}}
@keyframes breathe{50%{opacity:.6;scale:1.05}}
.portal.intro{animation:pin .75s cubic-bezier(.2,.9,.25,1.15) both,float 4.2s ease-in-out .75s infinite}
@keyframes pin{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
.hint{font-size:13px;color:#cfc8dc;margin:0}
.ui>*{animation:up .5s both}
@keyframes up{from{opacity:0;translate:0 12px}}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;padding:4px;border-radius:12px;background:#15111c;border:1px solid #2b2536}
.seg button{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:#cfc8dc;min-height:38px}
.seg button.on{background:rgb(var(--acc));color:#140d1c}
.pay button{display:flex;gap:8px;align-items:center;border:1px solid transparent}
.pay button.on{background:#221b12;color:#fff;border-color:var(--gold)}
.pay .coin{width:20px;height:20px;object-fit:contain}
.pay i{font-style:normal;background:#2d2638;border-radius:6px;padding:0 7px;font-size:12px}
.pay button.on i{background:var(--gold);color:#241a06}
.open{width:min(280px,80vw);min-height:50px;border-radius:14px;background:rgb(var(--acc));color:#180f22;font-weight:800;font-size:17px;display:flex;gap:12px;justify-content:center;align-items:center;transition:filter .2s,transform .15s}
.open:hover{filter:brightness(1.1)} .open:active{transform:scale(.97)}
.open span{font:500 12px JetBrains Mono;border-left:1px solid rgba(0,0,0,.3);padding-left:12px}
.open:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.pity{display:flex;gap:10px;align-items:center;width:min(280px,80vw)}
.pity b{color:var(--gold);font:500 11px JetBrains Mono}
.bar{flex:1;height:6px;background:#2a2433;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:rgb(var(--acc));width:2%;transition:width .6s}
/* ---- séquence ---- */
#seq{z-index:5}
#fx{position:absolute;inset:0;width:100%;height:100%}
.skip{position:absolute;top:16px;right:16px;padding:7px 14px;border-radius:20px;background:rgba(10,8,16,.7);border:1px solid #3a3446;font:700 12px Inter;letter-spacing:.08em}
.prog{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#ff7a2a,var(--gold));width:0}
.topline{position:fixed;left:0;top:0;height:2px;z-index:9;background:linear-gradient(90deg,#ff5a2a,var(--gold));width:0;transition:width .6s}
#flash{position:fixed;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}
/* ---- révélation ---- */
#fx2{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(closest-side,transparent 30%,rgba(0,0,0,.92));opacity:0;transition:opacity .6s;z-index:0}
#vig.on{opacity:1}
.cardzone{z-index:3}
.card.t1{animation:tr1 .12s linear infinite}.card.t2{animation:tr2 .08s linear infinite}.card.t3{animation:tr3 .05s linear infinite}
@keyframes tr1{25%{translate:1px 0}75%{translate:-1px 0}}
@keyframes tr2{25%{translate:3px -1px;rotate:.6deg}75%{translate:-3px 1px;rotate:-.6deg}}
@keyframes tr3{25%{translate:5px -2px;rotate:1.2deg}75%{translate:-5px 2px;rotate:-1.2deg}}
.card.lift{transition:transform 1.1s cubic-bezier(.3,0,.2,1);transform:translateY(-14px) scale(1.06) rotateX(8deg)}
.card .aura{position:absolute;inset:-6%;border-radius:8%;pointer-events:none;opacity:0;transition:opacity .4s;box-shadow:0 0 30px 6px rgba(var(--rc),.9),inset 0 0 30px rgba(var(--rc),.6)}
.card .aura.on{opacity:1;animation:auraP .7s ease-in-out infinite}
.card .aura.rainbow{box-shadow:0 0 34px 8px #ff6ad5,0 0 60px 14px #6af0ff}
.card .aura.rainbow.on{animation:auraP .5s ease-in-out infinite,hue 1.2s linear infinite}
@keyframes auraP{50%{transform:scale(1.03);filter:brightness(1.4)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:2}
.cracks.on{opacity:1}
.cracks path{fill:none;stroke:#ffd7b0;stroke-width:1.6;filter:drop-shadow(0 0 4px #ff5a28) drop-shadow(0 0 10px #ff5a28);stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke;transition:stroke-dashoffset 2s cubic-bezier(.5,0,.2,1)}
.cracks.on path{stroke-dashoffset:0}
.beat{animation:beat .55s cubic-bezier(.2,.8,.3,1)}
@keyframes beat{30%{scale:1.07}}

#rev{justify-content:center;gap:12px;padding:20px}
.cnt{position:absolute;top:14px;left:22px;font:700 40px Oswald,'Arial Narrow',sans-serif}
.cnt small{font-size:15px;color:var(--mute)}
.cardzone{position:relative;width:min(300px,62vw,44vh);aspect-ratio:3/4;perspective:1200px}
.rays{position:absolute;inset:-60%;border-radius:50%;opacity:0;pointer-events:none;
 background:repeating-conic-gradient(from 0deg,rgba(var(--rc),.55) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 20%,transparent 75%);mask:radial-gradient(closest-side,#000 20%,transparent 75%)}
.rays.on{opacity:1;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.3,.8,.3,1)}
.card.flip{transform:rotateY(180deg)}
.card.in{animation:cardin .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes cardin{from{opacity:0;transform:translateY(-40px) scale(.9)}}
.card.out{animation:cardout .35s ease-in forwards}
@keyframes cardout{to{opacity:0;transform:translateX(-120%) rotate(-14deg) rotateY(180deg)}}
.card.tremble{animation:tremble .09s linear infinite}
@keyframes tremble{25%{translate:2px -1px}75%{translate:-2px 1px}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4%}
.cback{background:radial-gradient(70% 60% at 50% 45%,#3b2a66,#140f26 70%),#140f26;border:2px solid #b98a3c;box-shadow:inset 0 0 0 5px #140f26,inset 0 0 0 6px #6b5028,0 18px 50px -12px rgba(0,0,0,.8);overflow:hidden}
.cback::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 65%,#fff,transparent),radial-gradient(1px 1px at 12% 70%,#fff,transparent);opacity:.7}
.cback .ring{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:1.5px solid #c99a46;display:grid;place-items:center}
.cback .ring img{width:118%}
.cback .ring::before,.cback .ring::after{content:"✦";position:absolute;color:#f3c552;font-size:16px;top:-12px}
.cback .ring::after{top:auto;bottom:-12px}
.cback .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);background-size:260% 100%;animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{from{background-position:150% 0}to{background-position:-60% 0}}
.cback.hot{box-shadow:inset 0 0 0 5px #140f26,inset 0 0 0 6px #6b5028,0 0 40px rgba(var(--rc),.9)}
.front{transform:rotateY(180deg)}
.art{position:absolute;inset:9% 12%;border-radius:3%;overflow:hidden;background:radial-gradient(80% 70% at 50% 35%,rgba(var(--rc),.55),#120d1a 75%)}
.art svg{position:absolute;bottom:0;left:50%;translate:-50% 0;width:78%;opacity:.85}
.art .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.art .pic~.nm,.art .pic~.st{background:linear-gradient(transparent,rgba(0,0,0,.6));}
.art .nm{position:absolute;left:8%;right:8%;bottom:11%;font:700 clamp(11px,1.8vw,15px) Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;text-shadow:0 2px 6px #000}
.art .st{position:absolute;left:8%;bottom:5%;font:500 10px JetBrains Mono;color:#e4dcf0}
.front>img{position:absolute;inset:0;width:100%;height:100%}
.who{text-align:center;min-height:52px;opacity:0;transition:opacity .3s}
.who.on{opacity:1}
.who h2{font:700 24px Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;margin:0}
.who p{margin:0;font-size:12px;color:var(--mute)}
.who em{color:var(--gold);font-style:normal;font-weight:700}
.strip{display:flex;gap:5px}
.strip i{width:20px;height:27px;border-radius:4px;background:#1c1724;border:1px solid #3a3446;transition:all .3s}
.strip i.cur{border-color:#fff;transform:translateY(-3px)}
.strip i.done{background:rgba(var(--rc),.75);border-color:rgb(var(--rc))}
.revbar{display:flex;gap:14px;align-items:center;font-size:12px;color:#cfc8dc}
.ghost{border:1px solid #4a4256;border-radius:6px;padding:8px 14px;font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;min-height:36px}
.ghost:hover{border-color:#fff}
body.shake{animation:shake .45s}
@keyframes shake{20%{translate:-7px 3px}40%{translate:6px -4px}60%{translate:-4px 2px}80%{translate:3px -1px}}
/* ---- récap ---- */
#recap{padding:22px 16px 30px;gap:10px}
.sum{background:#1a1522;border:1px solid #2e2738;border-radius:20px;padding:3px 12px;font-size:12px;color:#d8d2e4}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,150px));gap:54px 14px;justify-content:center;width:100%;margin-top:14px}
.mini{position:relative;aspect-ratio:3/4;animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}}
.mini .art{inset:9% 12%}
.mini>img{position:absolute;inset:0;width:100%;height:100%}
.mini .lab{position:absolute;top:-9px;left:50%;translate:-50% 0;z-index:3;font:800 9px Inter;letter-spacing:.08em;padding:2px 7px;border-radius:4px;background:var(--gold);color:#2a1d02;white-space:nowrap}
.mini .lab.dup{background:#4a4458;color:#eee}
.mini.best{transform:scale(1.14);z-index:2}
.mini.best::after{content:"Meilleure carte";position:absolute;bottom:-30px;left:50%;translate:-50% 0;white-space:nowrap;font:700 11px Inter;background:var(--gold);color:#2a1d02;padding:2px 10px;border-radius:20px}
.rgrid .row2{transform:rotate(var(--r,0deg))}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.acts .open{width:auto;padding:0 20px;font-size:14px}
@media(max-width:700px){.rgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 6px}.mini.best::after{font-size:9px;bottom:-22px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="topline" id="topline"></div>
<div id="flash"></div>

<section class="scr on" id="list">
  <header><img src="logo.webp" alt="Anime Rift"><p class="mono">Choisis une bannière</p></header>
  <div class="grid" id="grid"></div>
</section>

<section class="scr" id="hub">
  <div class="top"><button class="bk" id="backBtn">‹ Bannières</button><h1 class="cap" id="bname"></h1><button class="fav" id="fav" aria-label="Favori">★</button></div>
  <p class="mono tag">✦ MR 0,01 % · Bannière limitée pendant <b id="timer"></b></p>
  <div class="stage"><div class="portal" id="portal" role="button" aria-label="Ouvrir la faille"><span class="glow"></span><canvas id="pcv"></canvas></div></div>
  <div class="ui" style="display:flex;flex-direction:column;align-items:center;gap:12px">
    <p class="hint">Touche la faille ou écarte-la pour l'ouvrir</p>
    <div class="ctrl">
      <div class="seg" id="qty"><button data-n="1">×1</button><button data-n="5">×5</button><button data-n="10" class="on">×10</button></div>
      <div class="seg pay" id="pay"><button data-p="t" class="on"><img class="coin" src="__SEAL__" alt=""> Clés <i id="tk">0</i></button><button data-p="g"><img class="coin" src="__SOUL__" alt=""> Éclats <i id="gm">0</i></button></div>
    </div>
    <button class="open" id="openBtn">Ouvrir <span id="cost"></span></button>
    <div class="pity"><b>PITY</b><div class="bar"><i id="pbar"></i></div><b id="pval">0/50</b></div>
  </div>
</section>

<section class="scr" id="seq"><canvas id="fx"></canvas><button class="skip" id="skip">PASSER ›</button><i class="prog" id="prog"></i></section>

<section class="scr" id="rev"><canvas id="fx2"></canvas><div id="vig"></div>
  <div class="cnt" id="cnt"></div>
  <div class="cardzone" id="zone"><div class="rays" id="rays"></div></div>
  <div class="who" id="who"><h2 id="wname"></h2><p id="wsub"></p></div>
  <div class="strip" id="strip"></div>
  <div class="revbar"><span id="rhint">Touche la carte pour la retourner</span><button class="ghost" id="all">Tout révéler</button></div>
</section>

<section class="scr" id="recap">
  <h1 class="cap" id="rtitle"></h1>
  <span class="sum" id="rsum"></span>
  <div class="rgrid" id="rgrid"></div>
  <div class="acts"><button class="open" id="again"></button><button class="ghost" id="coll">Ma collection</button><button class="ghost" id="close">Fermer</button></div>
</section>

<script>
{
const $=s=>document.querySelector(s);
const U=[
 {id:'naruto',name:'Naruto',k:'忍',c:[255,120,20],c2:[255,215,110]},
 {id:'one_piece',name:'One Piece',k:'海',c:[235,40,40],c2:[255,205,90]},
 {id:'dragon_ball',name:'Dragon Ball',k:'龍',c:[255,160,20],c2:[80,150,255]},
 {id:'bleach',name:'Bleach',k:'死',c:[160,205,255],c2:[255,255,255]},
 {id:'demon_slayer',name:'Demon Slayer',k:'鬼',c:[30,210,150],c2:[255,120,160]},
 {id:'jujutsu_kaisen',name:'Jujutsu Kaisen',k:'呪',c:[240,140,170],c2:[150,80,255]},
 {id:'hunter_x_hunter',name:'Hunter x Hunter',k:'念',c:[60,235,110],c2:[255,215,80]}];
const RAR=['N','R','SR','SSR','LR','MR'];
const DEMO_MR=false; // démo : chaque invocation contient une MR (mettre false pour les vrais taux)
const RC={N:[170,176,186],R:[214,140,74],SR:[80,160,255],SSR:[245,194,66],LR:[255,110,220],MR:[255,90,40]};
const ODDS=[.42,.30,.17,.08,.0299,.0001];
const NAMES=['Exorciste du Rift','Lame Écarlate','Gardienne d’Onyx','Moine du Vide','Archer Céleste','Sorcier Fêlé','Veilleuse Lunaire','Chasseur d’Ombres','Héraut du Seuil','Oracle de Cendre','Duelliste Azur','Spectre Doré','Prince des Brumes','Sentinelle Ardente'];
const S={u:U[5],n:10,pay:'t',tickets:0,gems:0,pity:0,pulls:[],i:0,flipped:false,owned:new Set(),ct:1,cg:30};
// ANIME RIFT : pont avec le jeu (tirage réel, soldes, images, cadres)
const GAME=window.parent;const CAD=(id,r)=>(window.CADRES||{})[id+'_'+r]||'';let pullWait=null;
addEventListener('message',e=>{const m=e.data||{};if(m.type==='balance'){S.tickets=m.tickets;S.gems=m.gems;S.pity=m.pity;S.ct=m.ct;S.cg=m.cg;refresh()}
 if(m.type==='pulled'&&pullWait){const w=pullWait;pullWait=null;w(m)}
 if(m.type==='open'){S.n=m.n||S.n;S.pay=m.pay||S.pay;document.querySelectorAll('#qty button').forEach(x=>x.classList.toggle('on',+x.dataset.n===S.n));document.querySelectorAll('#pay button').forEach(x=>x.classList.toggle('on',x.dataset.p===S.pay));
  U.forEach((u,i)=>{u.end=m.ends[i]});openBanner(m.banner,$('#portal'))}});

/* ================= WebGL helper ================= */
const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const NOISE=`precision highp float;uniform vec2 res;uniform float t;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*n(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}`;
function glc(cv,fs){const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});if(!gl)return null;
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,NOISE+fs));gl.linkProgram(pr);gl.useProgram(pr);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

 if(s>.9&&!B.noCore){const k=Math.min(1,(s-.9)/.6);ctx.globalAlpha=1;crystalRaw(cx,cy,30+60*(1-Math.pow(1-k,3)),s*2.5,`rgb(${C})`,1)}
}
function crystalRaw(x,y,L,rot,c,al){const w=L*.42,h=L;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=al*.5;
 const hl=ctx.createRadialGradient(0,0,0,0,0,h*1.7);hl.addColorStop(0,c);hl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=hl;ctx.beginPath();ctx.arc(0,0,h*1.7,0,7);ctx.fill();ctx.globalAlpha=al;
 const P=[[0,-h],[w,-h*.45],[w,h*.45],[0,h],[-w,h*.45],[-w,-h*.45]];ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();
 const g=ctx.createLinearGradient(-w,-h,w,h);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.45,c);g.addColorStop(1,'rgba(40,5,0,.6)');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1;ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,-h);ctx.lineTo(0,h);ctx.moveTo(-w,-h*.45);ctx.lineTo(0,-h*.1);ctx.lineTo(w,-h*.45);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.stroke();ctx.restore()}
function crystal(x,y,L,rot,k,pulse,t){const c=k===4?`hsl(${(t/5)%360},100%,68%)`:`rgb(${RC[RAR[k]]})`,w=L*.42*pulse,h=L*pulse;
 const halo=ctx.createRadialGradient(x,y,0,x,y,h*1.6);halo.addColorStop(0,c);halo.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=.55;ctx.fillStyle=halo;ctx.beginPath();ctx.arc(x,y,h*1.6,0,7);ctx.fill();
 ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(rot)*.35);ctx.globalAlpha=1;const sx=Math.cos(rot);
 const P=[[0,-h],[w*sx,-h*.45],[w*sx,h*.45],[0,h],[-w*sx,h*.45],[-w*sx,-h*.45]];
 ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();
 const g=ctx.createLinearGradient(-w,-h,w,h);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.45,c);g.addColorStop(1,'rgba(20,10,30,.6)');ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1;ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,-h);ctx.lineTo(0,h);ctx.moveTo(-w*sx,-h*.45);ctx.lineTo(0,-h*.1);ctx.lineTo(w*sx,-h*.45);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.stroke();ctx.restore()}
$('#skip').onclick=()=>{seqRun++;startReveal()};

/* ================= révélation ================= */
const SIL='<svg viewBox="0 0 100 90"><path fill="rgba(0,0,0,.55)" d="M50 6c12 0 21 10 21 23s-9 24-21 24-21-11-21-24S38 6 50 6zM8 90c2-22 18-33 42-33s40 11 42 33z"/></svg>';
const art=p=>`<div class="art" style="--rc:${RC[p.r]}">${SIL}${p.img?`<img class="pic" src="${p.img}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<div class="nm">${p.name}</div><div class="st">ATK ${p.atk} · DEF ${p.def}</div></div>`;
const frame=p=>`<img src="${CAD(S.u.id,p.r)}" alt="">`;
function startReveal(){if(S.view==='rev')return;seqRun++;ctx.clearRect(0,0,fx.width,fx.height);BOOM=null;show('rev');skyGlow=1;S.i=0;
 $('#strip').innerHTML=S.pulls.map(()=>'<i></i>').join('');dealCard()}
function dealCard(){const p=S.pulls[S.i];S.flipped=false;const z=$('#zone');z.querySelector('.card')?.remove();
 $('#rays').classList.remove('on');$('#who').classList.remove('on');$('#rhint').textContent='Touche la carte pour la retourner';
 $('#cnt').innerHTML=`${S.i+1}<small>/${S.pulls.length}</small>`;
 [...$('#strip').children].forEach((e,k)=>e.classList.toggle('cur',k===S.i));
 const c=document.createElement('div');c.className='card in';c.style.setProperty('--rc',RC[p.r]);
 c.innerHTML=`<div class="aura"></div><div class="face cback ${p.k>=3?'hot':''}" style="--rc:${RC[p.r]}"><div class="ring"><img src="logo.webp" alt=""></div><div class="sheen"></div></div><div class="face front">${art(p)}${frame(p)}</div>`;
 z.appendChild(c);c.onclick=onCard;
 let sx=null;c.onpointerdown=e=>sx=e.clientX;c.onpointerup=e=>{if(sx!==null&&S.flipped&&sx-e.clientX>50){next()}sx=null}}
function onCard(){if(!S.flipped)flip();else next()}
const fx2=$('#fx2'),ctx2=fx2.getContext('2d');let gather=null,revLoop=0;
function sizeFx2(){const d=Math.min(devicePixelRatio||1,2);fx2.width=innerWidth*d;fx2.height=innerHeight*d;ctx2.setTransform(d,0,0,d,0,0)}
// particules aspirées vers la carte pendant le suspense
function startGather(p,rate){sizeFx2();const run=++revLoop,z=$('#zone').getBoundingClientRect(),cx=z.left+z.width/2,cy=z.top+z.height/2,pts=[];const col=RC[p.r];
 (function f(){if(run!==revLoop)return;ctx2.clearRect(0,0,innerWidth,innerHeight);
  for(let i=0;i<rate;i++){const a=Math.random()*6.28,d=Math.max(innerWidth,innerHeight)*.55;pts.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,v:0})}
  ctx2.globalCompositeOperation='lighter';
  for(let i=pts.length-1;i>=0;i--){const q=pts[i];q.v+=.6;const dx=cx-q.x,dy=cy-q.y,L=Math.hypot(dx,dy);if(L<30){pts.splice(i,1);continue}
   const ox=q.x,oy=q.y;q.x+=dx/L*q.v*2;q.y+=dy/L*q.v*2;ctx2.globalAlpha=Math.min(1,(600-L)/300+.3);ctx2.strokeStyle=p.k===4?`hsl(${(i*37+performance.now()/4)%360},100%,70%)`:`rgb(${col})`;ctx2.lineWidth=2;
   ctx2.beginPath();ctx2.moveTo(ox,oy);ctx2.lineTo(q.x,q.y);ctx2.stroke()}
  ctx2.globalAlpha=1;requestAnimationFrame(f)})();}
function stopFx2(){revLoop++;ctx2.clearRect(0,0,innerWidth,innerHeight)}
const CRACK='<svg class="cracks" viewBox="0 0 100 133" preserveAspectRatio="none"><path pathLength="1" d="M50 2 L46 20 L54 34 L44 52 L57 70 L47 88 L55 104 L49 131"/><path pathLength="1" d="M46 20 L30 26 L22 40"/><path pathLength="1" d="M54 34 L72 30 L80 18"/><path pathLength="1" d="M44 52 L24 60 L14 78"/><path pathLength="1" d="M57 70 L78 76 L88 96"/><path pathLength="1" d="M47 88 L32 98 L26 118"/><path pathLength="1" d="M55 104 L70 112 L74 128"/></svg>';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function flip(){const p=S.pulls[S.i],c=$('#zone .card');if(S.flipped||!c)return;S.flipped=true;c.onclick=null;c.classList.remove('in');
 const aura=c.querySelector('.aura');const z=$('#zone');z.style.setProperty('--rc',RC[p.r]);
 if(p.k===1){aura.classList.add('on');await wait(300)}
 else if(p.k===2){aura.classList.add('on');c.classList.add('t1');await wait(650)}
 else if(p.k===3){$('#vig').classList.add('on');aura.classList.add('on');c.classList.add('t2');startGather(p,3);await wait(1200)}
 else if(p.k===4){$('#vig').classList.add('on');aura.classList.add('on','rainbow');c.classList.add('t2');startGather(p,6);await wait(900);c.classList.replace('t2','t3');await wait(700)}
 else if(p.k===5){// cinématique MR
  $('#vig').classList.add('on');skyGlow=0;$('#who').classList.remove('on');document.querySelector('.revbar').style.opacity=0;$('#strip').style.opacity=0;$('#cnt').style.opacity=0;
  c.classList.add('lift');await wait(500);
  c.querySelector('.cback').insertAdjacentHTML('beforeend',CRACK);await wait(30);c.querySelector('.cracks').classList.add('on');
  aura.classList.add('on');startGather(p,4);
  for(let i=0;i<3;i++){c.classList.remove('beat');void c.offsetWidth;c.classList.add('beat');document.body.classList.remove('shake');void document.body.offsetWidth;if(i===2)document.body.classList.add('shake');await wait(480-i*80)}
  c.classList.add('t3');startGather(p,12);await wait(700);
  stopFx2();flash(1);c.classList.remove('t3','lift');
  // explosion sur le canvas de révélation
  sizeFx2();const zr=z.getBoundingClientRect();boomInit(zr.left+zr.width/2,zr.top+zr.height/2);BOOM.noCore=1;const run=++revLoop,st=performance.now();ctx=ctx2;
  (function f(){if(run!==revLoop){ctx=ctx1;return}const s=(performance.now()-st)/1000;ctx2.clearRect(0,0,innerWidth,innerHeight);ctx=ctx2;boomDraw(s+.18,zr.left+zr.width/2,zr.top+zr.height/2,innerWidth,innerHeight);ctx=ctx1;
   if(s<2.2)requestAnimationFrame(f);else mrAfter(p)})();
 }
 stopFx2Soon(p);c.classList.remove('t1','t2','t3');aura.classList.remove('on');c.classList.add('flip');
 setTimeout(()=>{burst(p);if(p.k<5)$('#vig').classList.remove('on')},300);
 $('#wname').textContent=p.name;$('#wsub').innerHTML=`${S.u.name} · ${p.dup?'Doublon ×2':'<em>Nouvelle carte</em>'} · ${p.r}`;setTimeout(()=>$('#who').classList.add('on'),p.k===5?1400:0);
 $('#rhint').textContent=S.i===S.pulls.length-1?'Touche pour voir le récapitulatif':'Touche ou glisse pour la suivante';const sl=$('#strip').children[S.i];sl.classList.add('done');sl.style.setProperty('--rc',RC[p.r]);
 setTimeout(()=>{c.onclick=onCard},p.k===5?1600:350)}
function stopFx2Soon(p){if(p.k<5)stopFx2()}
// après l'explosion MR : braises et aura qui restent autour de la carte
function mrAfter(p){if(!p.shown){p.shown=1;GAME.postMessage({type:'mr',id:p.id},'*')}skyGlow=.7;const run=++revLoop,z=$('#zone').getBoundingClientRect(),cx=z.left+z.width/2,cy=z.top+z.height/2,E=[];
 document.querySelector('.revbar').style.opacity='';$('#strip').style.opacity='';$('#cnt').style.opacity='';
 (function f(){if(run!==revLoop)return;ctx2.clearRect(0,0,innerWidth,innerHeight);ctx2.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){const a=Math.random()*6.28;E.push({x:cx+Math.cos(a)*z.width*.6,y:cy+Math.sin(a)*z.height*.55,vy:-(40+Math.random()*90),vx:(Math.random()-.5)*20,l:0,m:1.5+Math.random()*1.5,s:1+Math.random()*2.5})};
  for(let i=E.length-1;i>=0;i--){const e=E[i];e.l+=1/60;if(e.l>e.m){E.splice(i,1);continue}e.x+=e.vx/60+Math.sin(e.l*4+i)*.4;e.y+=e.vy/60;const a=1-e.l/e.m;
   const g=ctx2.createRadialGradient(e.x,e.y,0,e.x,e.y,e.s*4);g.addColorStop(0,'#fff');g.addColorStop(.3,'rgb(255,150,60)');g.addColorStop(1,'rgba(0,0,0,0)');ctx2.globalAlpha=a;ctx2.fillStyle=g;ctx2.beginPath();ctx2.arc(e.x,e.y,e.s*4,0,7);ctx2.fill()}
  ctx2.globalAlpha=1;requestAnimationFrame(f)})();}
function burst(p){const z=$('#zone');z.style.setProperty('--rc',RC[p.r]);
 if(p.k>=3)$('#rays').classList.add('on');
 if(p.k>=4){flash(p.k===5?.85:.6);document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake')}
 else if(p.k>=2)flash(.25);
 const n=[0,10,26,50,80,120][p.k];if(!n)return;const r=z.getBoundingClientRect();
 for(let i=0;i<n;i++){const s=document.createElement('i');const a=Math.random()*6.28,d=80+Math.random()*(120+p.k*40),sz=3+Math.random()*4;
  s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;width:${sz}px;height:${sz}px;border-radius:50%;z-index:6;pointer-events:none;background:rgb(${p.k===4?[[255,110,220],[110,240,255],[255,230,110]][i%3]:RC[p.r]});box-shadow:0 0 10px currentColor;color:rgb(${RC[p.r]})`;
  document.body.appendChild(s);s.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],{duration:800+Math.random()*600,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>s.remove()}}
function next(){stopFx2();$('#vig').classList.remove('on');const c=$('#zone .card');c.classList.add('out');setTimeout(()=>{S.i++;if(S.i>=S.pulls.length)recap();else dealCard()},300)}
$('#all').onclick=recap;

/* ================= récap ================= */
function recap(){{const mr=S.pulls.find(p=>p.k===5&&!p.shown);if(mr){mr.shown=1;GAME.postMessage({type:'mr',id:mr.id},'*')}}stopFx2();$('#vig').classList.remove('on');show('recap');skyGlow=.7;const P=S.pulls;const bi=P.reduce((b,p,i)=>p.k>P[b].k?i:b,0);
 let order=P.map((p,i)=>i);if(P.length===10){order=order.filter(i=>i!==bi);order.splice(2,0,bi)}
 const nNew=P.filter(p=>!p.dup).length;$('#rtitle').textContent=S.u.name;
 $('#rsum').textContent=`${nNew} nouvelle${nNew>1?'s':''} carte${nNew>1?'s':''}${P.length-nNew?`, ${P.length-nNew} doublon${P.length-nNew>1?'s':''}`:''}`;
 $('#rgrid').style.gridTemplateColumns=`repeat(${Math.min(5,P.length)},minmax(0,150px))`;
 $('#rgrid').innerHTML=order.map((i,k)=>{const p=P[i];const row2=P.length===10&&k>=5;const rot=row2?(k-7)*2.5:0;
  return`<div class="mini ${i===bi&&P.length>1?'best':''}" style="animation-delay:${k*.06+(p.k>=3?.25:0)}s;${row2?`rotate:${rot}deg;`:''}"><span class="lab ${p.dup?'dup':''}">${p.dup?'DOUBLE ×2':'NOUVEAU'}</span>${art(p)}${frame(p)}</div>`}).join('');
 $('#again').innerHTML=`Réinvoquer ×${S.n} <span>${S.pay==='t'?cost()+' clés':cost()+' Éclats'}</span>`}
$('#again').onclick=()=>{show('hub');refresh();setTimeout(summon,350)};
$('#coll').onclick=()=>GAME.postMessage({type:'collection'},'*');
$('#close').onclick=()=>{skyGlow=0;openBanner(U.indexOf(S.u),$('#portal'))};
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.view==='seq'){seqRun++;startReveal()}if((e.key===' '||e.key==='Enter')&&S.view==='rev'){e.preventDefault();onCard()}});
show('list');refresh();GAME.postMessage({type:'ready'},'*');
}
